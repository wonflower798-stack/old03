<script>

let state;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){state={correct:0,attempts:0,asked:new Set(),queue:[],current:null,answered:false,wrongTopics:{}}; nextQuestion()}
function pickNew(topic='') {let pool=BANK.filter(x=>!state.asked.has(x.id)&&( !topic || x.topic===topic)); if(!pool.length) pool=BANK.filter(x=>!state.asked.has(x.id)); return shuffle(pool)[0]||null}
function nextQuestion(){if(state.correct>=20||state.asked.size>=BANK.length){finish();return}let q=null;while(state.queue.length&&!q){let task=state.queue.shift();q=pickNew(task.topic)}q=q||pickNew();if(!q){finish();return}state.current=q;state.asked.add(q.id);state.answered=false;render();}
function update(){document.getElementById('correctText').textContent=`정답 ${state.correct} / 20`;document.getElementById('attemptText').textContent=`풀이 ${state.attempts}문항`;document.getElementById('bar').style.width=(state.correct/20*100)+'%';document.getElementById('state').textContent=`정답 ${state.correct} / 20`}
function render(){update();let q=state.current;document.getElementById('app').innerHTML=`<div class="tag">출제 영역 · ${q.topic}</div><div class="qno">제 ${state.asked.size}문항 · 원문 ${q.id}번</div><div class="question">${esc(q.q)}</div><div class="choices">${q.options.map((o,i)=>`<button class="choice" data-i="${i+1}" onclick="answer(${i+1})"><span class="num">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="actions"><button id="next" class="next" onclick="nextQuestion()">다음 문제</button></div>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])).replace(/\n/g,'<br>')}
function answer(n){if(state.answered)return;state.answered=true;state.attempts++;let q=state.current, ok=n===q.answer;document.querySelectorAll('.choice').forEach(b=>{let k=+b.dataset.i;b.disabled=true;if(k===q.answer)b.classList.add('correct');if(k===n&&k!==q.answer)b.classList.add('wrong')});let fb=document.getElementById('feedback');if(ok){state.correct++;fb.className='feedback good';fb.innerHTML=`<b>정답입니다.</b><div class="answerline">정답: ${circles[q.answer-1]} ${esc(q.options[q.answer-1])}</div>`}else{state.wrongTopics[q.topic]=(state.wrongTopics[q.topic]||0)+1;state.queue.push({topic:q.topic});fb.className='feedback bad';fb.innerHTML=`<b>오답입니다.</b><div class="answerline">정답: ${circles[q.answer-1]} ${esc(q.options[q.answer-1])}</div><div class="note">${BANK.some(x=>!state.asked.has(x.id)&&x.topic===q.topic)?`같은 학습영역(${q.topic})의 다른 문항으로 다음에 복습합니다.`:`같은 학습영역의 미출제 문항이 없어 다른 영역의 문항으로 이어집니다.`}</div>`}document.getElementById('next').classList.add('show');document.getElementById('next').textContent=state.correct>=20?'결과 확인':'다음 문제';update();if(state.correct>=20){document.getElementById('next').remove();document.getElementById('feedback').insertAdjacentHTML('beforeend',`<p><b>학습 종료 · 정답 20개 달성</b> / 총 ${state.attempts}문항 풀이</p><button class="restart" onclick="finish()">최종 결과 보기</button>`);document.getElementById('state').textContent='학습 완료'}}
function finish(){update();let remed=Object.entries(state.wrongTopics).map(([k,v])=>`${k} ${v}회`).join(' · ')||'없음';document.getElementById('state').textContent='시험 종료';document.getElementById('app').innerHTML=`<div class="finish"><div class="tag">CBT 종료</div><h1>${state.correct>=20?"20문제 정답을 달성했습니다":"미출제 문항이 모두 소진되었습니다"}</h1><div class="score">${state.correct} / 20</div><p>총 ${state.attempts}문항을 풀이했습니다. (오답 ${state.attempts-state.correct}문항)</p><p class="note">${state.correct<20?"중복 출제 방침에 따라 이번 시험을 마칩니다. 새 시험에서 다시 도전하세요.":"학습 목표를 달성했습니다."}</p><p class="note">오답 학습영역: ${remed}</p><button class="restart" onclick="init()">새 시험 시작</button></div>`}
init();
</script></body></html>
